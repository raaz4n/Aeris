<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Aeris</title>
        <link rel="stylesheet" href="../static/css/styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    </head>

    <body>
        <div id="header" class="lobster-regular">
            <nav>
                <a href="{{ url_for('aeris') }}">
                    <img width="100" height="100" alt="Aeris" src="../static/images/Aeris.png" />
                </a>
            </nav>
            <nav>
                <a href="{{ url_for('aeris') }}"><h1>Aeris</h1></a>
            </nav>
        </div>

        <div id="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="Search for a city...">
            <span class="clear-icon" id="clear-search">✕</span>
            <div id="locationList"></div>
        </div>
        
        <div class="unit-selector">
            <label>Unit:</label>
            <input type="radio" id="metric" name="unit" value="metric" checked>
            <label for="metric">°C</label>
            <input type="radio" id="imperial" name="unit" value="imperial">
            <label for="imperial">°F</label>
        </div>
        
        <div id="weather-display">
            <p id="temperature">Temperature: </p>
            <p id="weather">Weather: </p>
        </div>

        <script src="{{ url_for('static', filename='js/Aeris.js') }}"></script>
    </body>

    <div id="about">
        <nav>
            <a href="{{ url_for('about') }}"><h2>About</h2></a>
        </nav>
    </div>
</html>
